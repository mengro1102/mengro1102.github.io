<!doctype html>
<html lang="{{ site.lang }}"{% if page.skin %} data-skin="{{ page.skin }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="icon" type="image/jpeg" href="{{ site.brand.favicon | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ site.brand.favicon | relative_url }}">
  <link rel="manifest" href="{{ '/assets/img/favicons/manifest.json' | relative_url }}" crossorigin="use-credentials">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">

  {% if page.skin == 'mma' %}
  <!-- MMA skin: 운동일지 탭 전용 테마 (본문 폰트/토큰/컴포넌트를 별도로 덮어쓴다) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/mma.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% endif %}

  <!-- KaTeX for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"
    onload="renderMathInElement(document.body, {delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],throwOnError:false});"></script>

  {% feed_meta %}
  {% seo %}
  {% if site.google_analytics and site.google_analytics != "" %}
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}

  <!-- Mermaid.js for diagrams -->
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"
    onload="mermaid.initialize({startOnLoad:true, theme:'neutral', themeVariables:{primaryColor:'#8B5CF6',primaryTextColor:'#1E1B4B',lineColor:'#6366F1',secondaryColor:'#EDE9FE'}});"></script>

  <script>
    // Prevent flash of wrong theme: read stored preference synchronously
    (function(){
      try {
        var t = localStorage.getItem('sit-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch(e){}
    })();
  </script>
</head>
<body>
  {% include header.html %}

  <main class="site-main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script defer src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  {% if page.skin == 'mma' %}
  <script defer src="{{ '/assets/js/mma.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  {% endif %}
</body>
</html>
