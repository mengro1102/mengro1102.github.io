# ===== Site =====
title: "이명로의 Deep Dive"
tagline: "개인 블로그 및 기술 저장소"
description: "이명로의 개인 블로그입니다. 딥러닝과 자율주행, 그리고 다양한 기술들을 다룹니다."
url: "https://mengro1102.github.io"
baseurl: ""
lang: ko-KR
timezone: Asia/Seoul

# ===== Branding =====
brand:
  short_name: "ML"
  long_name: "Lee Myung-Ro"
  logo: "/assets/img/logo/SIT_Logo_128.png"
  mark:  "/assets/img/logo/SIT_Mark_512.png"
  favicon: "/assets/img/favicons/favicon.ico"
  github_org: "https://github.com/mengro1102"
  flagship_repo: "https://github.com/mengro1102/mengro1102.github.io"
  email: "leeroy7321@gmail.com"
  instagram: "https://instagram.com/meng._.ro"

# ===== Navigation tabs (header) =====
nav:
  - { title: "소개",       url: "/about/" }
  - { title: "Posts",      url: "/posts/" }
  - { title: "Concepts",   url: "/concepts/" }
  - { title: "Contact",    url: "/contact/" }

# ===== Collections =====
collections:
  posts:
    output: true
    permalink: /posts/:year/:month/:day/:title/
  concepts:
    output: true
    permalink: /concepts/:name/

# ===== Front-matter defaults =====
defaults:
  - scope: { path: "", type: "posts" }
    values:
      layout: post
      collection_name: posts
      collection_label: "Posts"
      collection_url: "/posts/"
  - scope: { path: "", type: "concepts" }
    values:
      layout: post
      collection_name: concepts
      collection_label: "Concepts"
      collection_url: "/concepts/"
  - scope: { path: "", type: "pages" }
    values:
      layout: page

# ===== Plugins =====
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# ===== Build =====
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

permalink: /:year/:month/:day/:title/
excerpt_separator: "<!-- more -->"

exclude:
  - _backup_mkdocs/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - .gitignore
  - .editorconfig
  - .gitattributes
  - .github/
  - node_modules/
  - .sass-cache/
