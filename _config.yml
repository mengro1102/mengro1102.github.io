# ===== Site =====
title: "이명로의 Deep Dive"
tagline: "AI 모델의 깊은 이해와 효율적인 실현을 기록합니다"
description: "LLM, SLM, Transformer 등 최신 AI 기술의 원리를 깊이 있게 파헤치고, 효율적인 최적화 및 구현 방법을 탐구하는 기술 블로그입니다."
url: "https://mengro1102.github.io"
google_analytics: "G-8Z8WJELV3X"
baseurl: ""
lang: ko-KR
timezone: Asia/Seoul

# ===== Branding =====
brand:
  short_name: "MR"
  long_name: "Lee Myeong Ro"
  logo: "/assets/img/profile.jpg"
  mark:  "/assets/img/profile.jpg"
  favicon: "/assets/img/profile.jpg"
  scholar_photo: "/assets/img/scholar_profile.jpg"
  github_org: "https://github.com/mengro1102"
  flagship_repo: "https://github.com/mengro1102/mengro1102.github.io"
  email: "leeroy7321@gmail.com"
  instagram: "https://instagram.com/meng._.ro"

# ===== Navigation tabs (header) =====
nav:
  - { title: "홈",         url: "/" }
  - { title: "소개",       url: "/about/" }
  - { title: "포스트",     url: "/posts/" }
  - { title: "기술개념",   url: "/concepts/" }
  - { title: "연락처",     url: "/contact/" }

# =============================================================
# ===== /workout/ — 독립 사이트 설정 ==========================
# =============================================================
# 이 블록 아래는 운동 기록 사이트(/workout/) 전용이며, 위쪽 블로그 설정과
# 공유하는 값이 하나도 없다. 나중에 별도 도메인으로 분리할 때는 이 블록만
# 새 저장소의 _config.yml 최상위로 옮기면 된다. (분리 절차: WORKOUT.md)
#
# 블로그 어디에서도 /workout/ 으로 가는 링크는 두지 않는다.
# 주소를 직접 아는 사람만 들어오는 페이지다.
workout:
  title: "MMA Training Log"
  tagline: "케이지 위에서 배우는 것들"
  description: "주짓수, 무에타이, 레슬링, 스파링까지 — 매트 위에서 보낸 시간과 체육관 활동을 세션 단위로 기록합니다."
  # 별도 도메인으로 옮기면 여기만 새 주소로 바꾼다.
  url: "https://mengro1102.github.io"
  baseurl: "/workout"
  nav:
    - { title: "훈련일지",   url: "/workout/" }
    - { title: "체육관 활동", url: "/workout/#gym-history" }

  # ---- 체육관 정보 ----
  # 'Gym History' 섹션에서만 쓴다. 헤더/히어로/푸터 등 훈련 로그 쪽에는
  # 체육관 정보를 노출하지 않는다 — 로그와 체육관은 분리해서 보여준다.
  gym:
    name: "Team Geumcheon"
    short: "TGC"
    name_ko: "팀 금천 MMA"
    # 로고 파일을 assets/workout/img/ 에 넣고 아래 경로를 채우면 표시된다.
    # 비워 두면 TGC 옥타곤 마크가 대신 나온다.
    logo: ""
    since: 2024-03-01
  # 필터 칩과 종목별 통계에 사용. 일지 front matter 의 discipline 값과 일치해야 한다.
  disciplines:
    - { name: "MMA",      slug: "mma",      color: "#E11D48" }
    - { name: "주짓수",   slug: "bjj",      color: "#3B82F6" }
    - { name: "무에타이", slug: "muaythai", color: "#F97316" }
    - { name: "레슬링",   slug: "wrestling", color: "#10B981" }
    - { name: "복싱",     slug: "boxing",   color: "#A855F7" }
    - { name: "컨디셔닝", slug: "strength", color: "#EAB308" }

# ===== Collections =====
collections:
  posts:
    output: true
    permalink: /posts/:year/:month/:day/:title/
  concepts:
    output: true
    permalink: /concepts/:name/
  workouts:
    output: true
    permalink: /workout/:name/

# ===== Front-matter defaults =====
defaults:
  - scope: { path: "", type: "posts" }
    values:
      layout: post
      collection_name: posts
      collection_label: "포스트"
      collection_url: "/posts/"
  - scope: { path: "", type: "concepts" }
    values:
      layout: post
      collection_name: concepts
      collection_label: "기술개념"
      collection_url: "/concepts/"
  - scope: { path: "", type: "workouts" }
    values:
      layout: workout-log
      collection_label: "훈련일지"
      collection_url: "/workout/"
  - scope: { path: "", type: "pages" }
    values:
      layout: page

# ===== Plugins =====
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# ===== Build =====
theme: null
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

permalink: /:year/:month/:day/:title/
excerpt_separator: "<!-- more -->"

exclude:
  - _backup_mkdocs/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md
  - WORKOUT.md
  - LICENSE
  - .gitignore
  - .editorconfig
  - .gitattributes
  - .github/
  - node_modules/
  - .sass-cache/
