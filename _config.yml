  email: "leeroy7321@gmail.com"
  instagram: "https://instagram.com/meng._.ro"

# ===== Navigation tabs (header) =====
nav:
  - { title: "홈",         url: "/" }
  - { title: "소개",       url: "/about/" }
  - { title: "포스트",     url: "/posts/" }
  - { title: "기술개념",   url: "/concepts/" }
  - { title: "연락처",     url: "/contact/" }

# =============================================================
# ===== /workout/ — 독립 사이트 설정 ==========================
# =============================================================
# 이 블록 아래는 운동 기록 사이트(/workout/) 전용이며, 위쪽 블로그 설정과
# 공유하는 값이 하나도 없다. 나중에 별도 도메인으로 분리할 때는 이 블록만
# 새 저장소의 _config.yml 최상위로 옮기면 된다. (분리 절차: WORKOUT.md)
#
# 블로그 어디에서도 /workout/ 으로 가는 링크는 두지 않는다.
# 주소를 직접 아는 사람만 들어오는 페이지다.
workout:
  title: "MMA Training Log"
  tagline: "케이지 위에서 배우는 것들"
  description: "링과 매트 위에서 보낸 시간을 곱씹어 개인적인 생각을 정리하는 운동 노트입니다."
  # 별도 도메인으로 옮기면 여기만 새 주소로 바꾼다.
  url: "https://mengro1102.github.io"
  baseurl: "/workout"
  # /workout/ 은 두 페이지로 나뉜다.
  #   /workout/      → 개인기록 (훈련 로그)
  #   /workout/gym/  → 체육관 정보 (팀금천)
  nav:
    - { title: "개인기록",    url: "/workout/" }
    - { title: "체육관 정보", url: "/workout/gym/" }

  # ---- 세션 카테고리 ----
  # 종목(주짓수/무에타이…)이 아니라 '타격 / 그래플링' 축으로 나눈다.
  # 일지 front matter 의 category 값과 이름이 정확히 일치해야 한다.
  # 한 세션이 두 축에 걸치면 둘 다 적는다: category: ["타격", "그래플링"]
  categories:
    - { name: "타격",     slug: "striking",     color: "#E11D48" }
    - { name: "그래플링", slug: "grappling",    color: "#3B82F6" }
    - { name: "컨디셔닝", slug: "conditioning", color: "#EAB308" }

  # ---- 체육관 정보 ----
  # /workout/gym/ 에서만 쓴다. 개인기록 쪽에는 체육관 정보를 노출하지 않는다.
  gym:
    name: "Team Geumcheon"
    short: "TGC"
    name_ko: "팀 금천 MMA"
    # 로고 파일을 assets/workout/img/ 에 넣고 아래 경로를 채우면 표시된다.
    # 비워 두면 TGC 옥타곤 마크가 대신 나온다.
    logo: ""
    since: 2024-03-01

# ===== Collections =====
collections:
  posts:
    output: true
    permalink: /posts/:year/:month/:day/:title/
  concepts:
    output: true
    permalink: /concepts/:name/
  workouts:
    output: true
    # /workout/gym/ 페이지와 겹치지 않도록 로그는 /workout/log/ 아래에 둔다.
    permalink: /workout/log/:name/

# ===== Front-matter defaults =====
defaults:
  - scope: { path: "", type: "posts" }
    values:
      layout: post
      collection_name: posts
      collection_label: "포스트"
      collection_url: "/posts/"
  - scope: { path: "", type: "concepts" }
    values:
      layout: post
      collection_name: concepts
      collection_label: "기술개념"
      collection_url: "/concepts/"
  - scope: { path: "", type: "workouts" }
    values:
      layout: workout-log
      collection_label: "개인기록"
      collection_url: "/workout/"
  - scope: { path: "", type: "pages" }
    values:
      layout: page

# ===== Plugins =====
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# ===== Build =====
theme: null
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

permalink: /:year/:month/:day/:title/
excerpt_separator: "<!-- more -->"

exclude:
  - _backup_mkdocs/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md
  - WORKOUT.md
  - WORKOUT-PROMPT.md
  - LICENSE
  - .gitignore
  - .editorconfig
  - .gitattributes
  - .github/
  - node_modules/
  - .sass-cache/
