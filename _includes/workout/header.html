{%- assign wk = site.workout -%}
<header class="wk-header">
  <div class="wk-container wk-header__inner">
    <a class="wk-brand" href="{{ '/workout/' | relative_url }}" aria-label="{{ wk.title }} 홈">
      <span class="wk-brand__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30">
          <polygon points="9.4,0 22.6,0 32,9.4 32,22.6 22.6,32 9.4,32 0,22.6 0,9.4" fill="currentColor" opacity=".12"/>
          <polygon points="11.3,4 20.7,4 28,11.3 28,20.7 20.7,28 11.3,28 4,20.7 4,11.3" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
      </span>
      <span class="wk-brand__text">
        <span class="wk-brand__title">{{ wk.title }}</span>
        <span class="wk-brand__sub">{{ wk.athlete }} · {{ wk.gym }}</span>
      </span>
    </a>

    <nav class="wk-nav" aria-label="주 메뉴">
      <ul>
        {%- for item in wk.nav -%}
        <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
        {%- endfor -%}
      </ul>
    </nav>

    <button class="wk-theme-toggle" type="button" aria-label="다크 모드로 전환">
      <svg class="wk-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="wk-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>
  </div>
</header>
