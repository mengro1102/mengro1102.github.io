---
layout: default
title: "Posts"
---

<div class="hero">
  <div class="container hero-inner">
    <span class="hero-eyebrow">BLOG POSTS</span>
    <h1>기술 <span class="accent">포스트</span></h1>
    <p class="lead">딥러닝, 자율주행, 그리고 일상의 기술적 고민들을 기록합니다.</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="posts-grid">
      {% assign posts = site.posts | sort: 'date' | reverse %}
      {% for post in posts %}
        {% include postcard.html post=post %}
      {% endfor %}
    </div>
  </div>
</section>
